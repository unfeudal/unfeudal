name: unfeudal_client
description: Unfeudal desktop client.
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  unfeudal_shared:
    path: ../shared
  http: ^1.6.0
  sqlite3: ^3.7.1
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  dartssh2: ^4.1.0
  xterm2: ^5.4.0
  cryptography: ^2.9.0
  pointycastle: ^4.0.0
  intl: any
  file_selector: ^1.1.0
  url_launcher: ^6.3.3
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_localizations:
    sdk: flutter
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/Alegreya-OFL.txt
    - assets/fonts/HankenGrotesk-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
    - assets/fonts/Phosphor-LICENSE.txt

  fonts:
    - family: Alegreya
      fonts:
        - asset: assets/fonts/Alegreya-Bold.ttf
          weight: 700
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
