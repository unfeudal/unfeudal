include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - windows/**
    - macos/**
    - lib/l10n/app_localizations*.dart

linter:
  rules: [avoid_print, prefer_final_locals, unawaited_futures, prefer_single_quotes]
