name: Bug report
description: Something does not work as expected.
labels: ["type: bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: "Security issue? Do not file it here: use [Report a vulnerability](https://github.com/unfeudal/unfeudal/security/advisories/new)."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client version and OS
      placeholder: "0.1.0, Windows 11"
  - type: input
    id: server
    attributes:
      label: Server version and database
      placeholder: "0.1.0, PostgreSQL 16"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any host name, address or secret you do not want public.
      render: text
