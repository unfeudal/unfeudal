name: release-server
on:
  push:
    tags: ["server-v*"]
permissions:
  contents: read
jobs:
  check:
    # releases stay off until the repository variable RELEASES_ENABLED is 'true'
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: cd tool && dart pub get && dart run bin/check_tag.dart "$GITHUB_REF_NAME"
  test:
    needs: check
    uses: $/.github/workflows/server.yml
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # pushing the attestation to the registry also records the image as an artifact of the org
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: git.killiandalcin.fr
          username: unfeudal-bot
          password: ${{ secrets.GITEA_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/unfeudal/unfeudal-server:${{ steps.v.outputs.version }}
            ghcr.io/unfeudal/unfeudal-server:latest
            git.killiandalcin.fr/unfeudal/unfeudal-server:${{ steps.v.outputs.version }}
            git.killiandalcin.fr/unfeudal/unfeudal-server:latest
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/unfeudal/unfeudal-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: $/.github/actions/release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gitea-token: ${{ secrets.GITEA_TOKEN }}
