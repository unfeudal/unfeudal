name: release-server
on:
  push:
    tags: ["server-v*"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: cd tool && dart pub get && dart run bin/check_tag.dart "$GITHUB_REF_NAME"
  test:
    needs: check
    uses: $/.github/workflows/server.yml
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: git.killiandalcin.fr
          username: unfeudal-bot
          password: ${{ secrets.GITEA_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/unfeudal/unfeudal-server:${{ steps.v.outputs.version }}
            ghcr.io/unfeudal/unfeudal-server:latest
            git.killiandalcin.fr/unfeudal/unfeudal-server:${{ steps.v.outputs.version }}
            git.killiandalcin.fr/unfeudal/unfeudal-server:latest
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/unfeudal/unfeudal-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: cd tool && dart pub get && dart run bin/changelog.dart server "${GITHUB_REF_NAME#server-v}" > ../notes.md
      # draft first, published last: immutable releases freeze what is published
      - run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          jq -n --arg t "$GITHUB_REF_NAME" --arg c "$GITHUB_SHA" --rawfile b notes.md \
            '{tag_name: $t, target_commitish: $c, name: $t, body: $b}' |
          curl --fail --retry 5 --retry-all-errors -H "Authorization: token $GITEA_TOKEN" -H 'Content-Type: application/json' \
            -d @- https://git.killiandalcin.fr/api/v1/repos/unfeudal/unfeudal/releases
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
