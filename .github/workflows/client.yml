name: client
on:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, target: windows}
          - {os: macos-latest, target: macos}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run: {shell: bash, working-directory: client}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: {channel: stable}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags docker,slow
      - run: flutter build "$TARGET" --debug
        env:
          TARGET: ${{ matrix.target }}
