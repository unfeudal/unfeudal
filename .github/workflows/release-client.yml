name: release-client
on:
  push:
    tags: ["client-v*"]
permissions:
  contents: read
jobs:
  check:
    # releases stay off until the repository variable RELEASES_ENABLED is 'true'
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: cd tool && dart pub get && dart run bin/check_tag.dart "$GITHUB_REF_NAME"
  test:
    needs: check
    uses: $/.github/workflows/client.yml
  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: $/.github/actions/flutter
      - run: cd client && flutter build windows --release
      - shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".Substring(8)
          $rel = "client/build/windows/x64/runner/Release"
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') { Copy-Item "$env:SystemRoot\System32\$dll" $rel }
          New-Item -ItemType Directory -Force client/dist | Out-Null
          Compress-Archive -Path "$rel\*" -DestinationPath "client/dist/Unfeudal-$v-windows-x64.zip"
          $env:UNFEUDAL_VERSION = $v
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" client/windows/installer/unfeudal.iss
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: client/dist/*
  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: $/.github/actions/flutter
      - run: cd client && flutter build macos --release
      - run: |
          v="${GITHUB_REF_NAME#client-v}"
          mkdir -p client/dist
          hdiutil create -volname Unfeudal -srcfolder client/build/macos/Build/Products/Release/Unfeudal.app -ov -format UDZO "client/dist/Unfeudal-$v-macos.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: client/dist/*
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: $/.github/actions/release
        with:
          assets: dist/*
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gitea-token: ${{ secrets.GITEA_TOKEN }}
